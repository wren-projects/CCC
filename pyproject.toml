[project]
name = "ccc"
version = "0.1.0"
description = "Solutions and CLI for the Cloudflight Coding Contest"
readme = "README.md"
requires-python = ">=3.15"
dependencies = ["platformdirs>=4.3.6", "quads", "requests>=2.32.3"]

[project.scripts]
ccc = "ccc_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccc_cli"]
